<!-- orderTracker.html -->
<template>
    <lightning-card title="Order Tracking" icon-name="standard:shipment">
        <div class="slds-p-around_medium slds-is-relative">
            <!-- Loading State -->
            <template if:true={isLoading}>
                <div style="height: 200px;">
                    <lightning-spinner alternative-text="Loading tracking data..." size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Map Display -->
            <div class={mapClass}>
                <div lwc:dom="manual" class="map-root"></div>
            </div>
            
            <!-- Info Panel -->
            <template if:true={order.data}>
                <div class="slds-m-top_medium">
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <lightning-icon icon-name="utility:shipping_item" size="small" class="slds-m-right_small"></lightning-icon>
                        <span class="slds-text-heading_small">Status: {status}</span>
                    </div>
                    <div class="slds-m-top_x-small slds-text-body_small">
                        <p class="slds-text-title_caps slds-m-bottom_xx-small">Shipping Address</p>
                        <p>{effectiveDeliveryStreet}</p>
                        <p>{effectiveDeliveryCity} {effectiveDeliveryPostalCode}</p>
                        <p>{effectiveDeliveryCountry}</p>
                    </div>
                </div>
            </template>

            <!-- Error State -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>{errorMessage}</h2>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
